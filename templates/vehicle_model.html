<div class="modal fade" id="vehicleModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-body row">
        <div class="col-md-6"><img src="{{ url_for('static', filename='images/' ~ v.image) }}" class="img-fluid rounded"></div>
        <div class="col-md-6">
          <h4>{{ v.model }} ({{ v.vehicle_type }})</h4>
          <p class="small text-muted">Available at <strong>{{ v.location }}</strong></p>
          <p class="mb-1 fw-bold">₹ {{ v.rent_rate }} / Day</p>
          <a href="{{ url_for('reserve', vid=v.vehicle_id) }}" class="btn btn-success">Reserve</a>
          <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>
</div>
